name: Deploy Viktor Games Hub to Railway

on:
  push:
    branches:
      - main
      - master
    paths:
      - viktor-games-hub/**
      - .github/workflows/deploy-viktor-games-hub.yml
  workflow_dispatch:

concurrency:
  group: railway-viktor-games-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      APP_DIR: viktor-games-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viktor-games-hub/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Test audio transitions
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          set -euo pipefail

          deploy_args=(up --ci --path-as-root "$APP_DIR")

          if [ -n "${RAILWAY_SERVICE:-}" ]; then
            deploy_args+=(--service "$RAILWAY_SERVICE")
          fi

          if [ -n "${RAILWAY_ENVIRONMENT:-}" ]; then
            deploy_args+=(--environment "$RAILWAY_ENVIRONMENT")
          fi

          railway "${deploy_args[@]}"
