<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Viktor Games Lab social preview</title>
  <desc id="desc">Dark browser games hub preview with tactical minesweeper grid and warning accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070908"/>
      <stop offset="0.55" stop-color="#121a16"/>
      <stop offset="1" stop-color="#2a150c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 128) rotate(125) scale(640 430)">
